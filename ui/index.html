<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réunion</title>
<style>
:root {
  /* Jetons de couleur, copiés ici : la page tourne hors ligne. Habillage neutre, police du système. */
  --accent: #0f6e66; --accent-fort: #0b5550; --accent-clair: #e2f1ee; --focus: #0f6e66; --papier: #f6f7f7;
  --ink: #1c2124; --body: #3f474c; --body-soft: #5a6369; --surface: #fff; --bord: #dadfe1; --bord-fort: #7d878c;
  --danger: #8f2230; --danger-fond: #fdedee; --danger-bord: #e8babf;
  --alerte: #7a5d1b; --alerte-fond: #fdf8ed; --alerte-bord: #e8daba;
  --succes: #1d7b4f; --rec: #c42d3c; --rec-fort: #a42532;
  --loc-1: #0f6e66; --loc-2: #3a5fc8; --loc-3: #876820; --loc-4: #8a43bd; --loc-5: #b0491a;
  --note: #fff7d9; --note-bord: #c9a227;
  --rayon: 8px; --ombre: 0 1px 2px rgb(28 33 36 / .06), 0 4px 16px rgb(28 33 36 / .06);
  --vite: 150ms;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--body); background: var(--papier); }
h1, h2, h3, h4 { color: var(--ink); margin: 0; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.evite { position: absolute; left: -9999px; }
.evite:focus { left: 8px; top: 8px; z-index: 50; background: var(--surface); padding: 8px 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Gabarit */
.page { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
.cote { background: var(--surface); border-right: 1px solid var(--bord); padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.marque { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.marque h1 { font-size: 20px; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.principal { padding: 28px clamp(16px, 4vw, 48px) 40px; min-width: 0; }
#contenu:focus { outline: none; }
.colonne { max-width: 880px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 14px; border-radius: var(--rayon); border: 1px solid var(--bord-fort); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: none; transition: background var(--vite), border-color var(--vite); }
.btn:hover { border-color: var(--accent); background: var(--accent-clair); }
.btn.principal-btn { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.principal-btn:hover { background: var(--accent-fort); }
.btn.rec { background: var(--rec); border-color: var(--rec); color: #fff; }
.btn.rec:hover { background: var(--rec-fort); }
.btn.danger { color: var(--danger); }
.btn.lien { border: 0; background: none; color: var(--accent-fort); padding: 4px 6px; min-height: 32px; text-decoration: underline; text-underline-offset: 3px; }
.btn.petit { min-height: 32px; padding: 4px 10px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-enreg { width: 100%; min-height: 52px; font-size: 17px; }
.pastille-rec { width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgb(255 255 255 / .35); }
.pastille-rec.carre { border-radius: 2px; }

.local { display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 14px; color: var(--ink); flex-wrap: wrap; }
.local .ico { color: var(--accent); }
.local .btn.lien { margin-left: auto; font-size: 13px; min-height: 24px; padding: 0 4px; }
.cherche { width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--bord-fort); border-radius: var(--rayon); background: var(--surface); }
.cherche:focus { outline: 2px solid var(--focus); outline-offset: 1px; }

.jour { font-size: 13px; font-weight: 600; color: var(--body-soft); padding: 8px 8px 4px; }
.liste { list-style: none; margin: 0; padding: 0; }
.liste a { display: block; padding: 10px; border-radius: var(--rayon); color: inherit; text-decoration: none; }
.liste a:hover { background: var(--papier); }
.liste a[aria-current=true] { background: var(--accent-clair); }
.liste .t { display: block; color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
.liste .m { font-size: 13px; color: var(--body-soft); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.etat { font-size: 12px; font-weight: 600; padding: 0 8px; border-radius: 999px; border: 1px solid var(--bord); }
.etat.pret { color: var(--succes); }
.etat.cours { color: var(--alerte); background: var(--alerte-fond); border-color: var(--alerte-bord); }
.etat.echec { color: var(--danger); background: var(--danger-fond); border-color: var(--danger-bord); }
.etat.rec { color: var(--rec); border-color: var(--danger-bord); display: inline-flex; gap: 4px; align-items: center; }
.etat.rec::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--rec); }
.compteur { font-size: 14px; color: var(--body-soft); }
.bas-cote { margin-top: auto; }
.hero { display: grid; gap: 10px; }
.donner summary { color: var(--accent-fort); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
.donner label { display: block; font-weight: 600; color: var(--ink); margin: 10px 0 4px; }
.donner input { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--bord-fort); border-radius: var(--rayon); }
.resume { margin-top: 20px; color: var(--ink); }
.conseille { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 12px; font-size: 14px; color: var(--ink); }
.conseille .etiq { font-size: 12px; font-weight: 700; padding: 0 8px; border: 1px solid var(--bord-fort); border-radius: 999px; color: var(--body); }
.conseille p { flex: 1; min-width: 200px; }

.bandeau { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--rayon); border: 1px solid var(--bord); background: var(--surface); font-size: 15px; color: var(--ink); }
.bandeau > div { flex: 1; min-width: 0; }
.bandeau .ico { margin-top: 2px; }
.bandeau.jaune { background: var(--alerte-fond); border-color: var(--alerte-bord); }
.bandeau.jaune .ico { color: var(--alerte); }
.bandeau.rouge { background: var(--danger-fond); border-color: var(--danger-bord); }
.bandeau.rouge .ico { color: var(--danger); }
.bandeau .actions { margin-top: 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note-aide { font-size: 14px; color: var(--body-soft); }
progress { width: 100%; height: 10px; accent-color: var(--accent); }
progress + b { white-space: nowrap; }
.retour-mobile { display: none; }
.dl { margin-top: 16px; font-size: 14px; color: var(--body-soft); display: grid; gap: 4px; }
.global { position: sticky; top: 0; z-index: 30; border-radius: 0; }
.fait { font-size: 13px; font-weight: 600; color: var(--succes); }
.fait.ko, .ko-t { color: var(--danger); font-size: 14px; font-weight: 600; }

/* Accueil vide */
.vide { max-width: 520px; margin: 10vh auto 0; text-align: center; }
.vide h2 { font-size: 24px; margin-bottom: 8px; }
.conseils { text-align: left; margin: 28px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.conseils li { display: flex; gap: 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); }
.conseils .ico { color: var(--accent); margin-top: 3px; }

/* Enregistrement */
.enreg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.carte { background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 20px; }
.chrono { display: flex; align-items: center; gap: 12px; }
.chrono .point { width: 14px; height: 14px; border-radius: 50%; background: var(--rec); animation: pouls 1.4s ease-in-out infinite; }
@keyframes pouls { 50% { opacity: .4; } }
.chrono b { font-size: 44px; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.jauges { display: grid; gap: 12px; margin: 16px 0; }
.jauge { display: grid; grid-template-columns: 150px 1fr 60px; gap: 10px; align-items: center; font-size: 15px; }
.jauge .barre { height: 10px; border-radius: 5px; background: var(--papier); border: 1px solid var(--bord); overflow: hidden; }
.jauge .barre i { display: block; height: 100%; background: var(--accent); transition: width 200ms; }
.jauge b { color: var(--ink); }
.empile { display: grid; gap: 8px; margin-bottom: 16px; }
.champ-note label { display: block; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.champ-note input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--bord-fort); border-radius: var(--rayon); }
.champ-note input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.vos-notes { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.vos-notes li { display: flex; gap: 10px; font-size: 15px; padding: 6px 10px; background: var(--note); border-left: 3px solid var(--note-bord); border-radius: 4px; color: var(--ink); }
.vos-notes time { font-variant-numeric: tabular-nums; color: var(--body-soft); }
.verif { font-style: italic; color: var(--ink); margin-top: 6px; }

.direct { border: 1px dashed var(--bord-fort); border-radius: var(--rayon); background: repeating-linear-gradient(135deg, #fbfbfb 0 8px, #f3f4f4 8px 16px); }
.direct header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px dashed var(--bord-fort); }
.direct.replie header { border-bottom: 0; }
.direct h3 { font-size: 16px; }
.direct header .btn { margin-left: auto; }
.retard { font-size: 13px; font-weight: 600; color: var(--alerte); background: var(--alerte-fond); border: 1px solid var(--alerte-bord); border-radius: 999px; padding: 0 8px; }
.direct .mention { padding: 10px 14px 0; font-size: 14px; color: var(--body-soft); }
.morceaux { list-style: none; margin: 0; padding: 8px 14px 14px; display: grid; gap: 8px; max-height: 640px; overflow: auto; }
.morceaux li { display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; font-size: 15px; }
.morceaux time { font-size: 13px; color: var(--body-soft); font-variant-numeric: tabular-nums; padding-top: 2px; }
.morceaux .qui { font-size: 13px; font-weight: 650; color: var(--body); }
.morceaux p { grid-column: 2; color: var(--body); }
.morceaux li.n p { background: var(--note); border-left: 3px solid var(--note-bord); padding: 2px 8px; color: var(--ink); }
.direct.grise .morceaux { opacity: .6; }
.direct .revenir { margin: 0 14px 12px; }

/* Réunion ouverte */
.tete { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.tete h2 { font-size: clamp(22px, 3vw, 28px); overflow-wrap: anywhere; }
.tete h2 button { all: unset; cursor: text; border-radius: 4px; }
.tete h2 button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.tete .meta { font-size: 14px; color: var(--body-soft); margin-top: 4px; }
.titre-champ { width: 100%; padding: 2px 8px; border: 1px solid var(--accent); border-radius: var(--rayon); font-size: clamp(20px, 3vw, 26px); font-weight: 650; color: var(--ink); }
.voix { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 12px 0 6px; align-items: start; }
.voix-carte { background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 10px 12px; display: grid; gap: 4px; align-content: start; border-left: 4px solid var(--c); }
.voix-carte.prop { border-style: dashed; border-left-style: solid; background: #fcfdfd; }
.voix-carte .nom { font-weight: 650; color: var(--ink); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; overflow-wrap: anywhere; }
.voix-carte .nom em { font-style: italic; }
.nom-btn { all: unset; cursor: pointer; border-radius: 4px; text-decoration: underline dotted; text-underline-offset: 4px; }
.nom-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.voix-carte small { font-size: 13px; color: var(--body-soft); }
.conf { font-size: 13px; font-weight: 600; color: var(--accent-fort); }
.voix-carte .actions { gap: 6px; }
.voix-carte input[type=text] { width: 100%; min-height: 36px; padding: 4px 8px; border: 1px solid var(--accent); border-radius: 6px; }
.suggest { margin: 4px 0 0; padding: 4px; list-style: none; border: 1px solid var(--bord); border-radius: 6px; background: var(--surface); font-size: 14px; max-height: 260px; overflow: auto; }
.suggest li { padding: 6px; border-radius: 4px; cursor: pointer; }
.suggest li[aria-selected=true] { background: var(--accent-clair); }
.suggest li.deja { color: var(--body-soft); }
.suggest li.sep { border-top: 1px solid var(--bord); }
.suggest small { color: var(--body-soft); }
details.menu { position: relative; }
details.menu > summary { list-style: none; }
details.menu > summary::-webkit-details-marker { display: none; }
.menu-liste { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; min-width: 230px; background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 4px; display: grid; }
.menu-liste.droite-m { left: auto; right: 0; }
.menu-liste button { border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 6px; min-height: 40px; }
.menu-liste button:hover, .menu-liste button:focus-visible { background: var(--papier); }
.menu-liste .titre-m { padding: 6px 12px; font-size: 13px; color: var(--body-soft); }
.menu-liste .danger, .danger-t { color: var(--danger); }
.flottant { position: fixed; z-index: 40; }
.cr { background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 16px 18px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.participants { margin-top: 16px; font-size: 15px; color: var(--ink); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.participants input { flex: 1; min-width: 200px; min-height: 36px; padding: 4px 8px; border: 1px solid var(--accent); border-radius: 6px; }
.case { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.case input { accent-color: var(--accent); width: 16px; height: 16px; margin-top: 2px; flex: none; }

.outils { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 8px; }
.outils .cherche { flex: 1; min-width: 200px; }
.outils select { min-height: 40px; padding: 6px 10px; border: 1px solid var(--bord-fort); border-radius: var(--rayon); background: var(--surface); max-width: 100%; }
.onglets { display: flex; gap: 4px; border-bottom: 1px solid var(--bord); margin-top: 16px; }
.onglets button { border: 0; background: none; padding: 8px 12px; font-weight: 600; color: var(--body-soft); border-bottom: 3px solid transparent; }
.onglets button[aria-selected=true] { color: var(--ink); border-color: var(--accent); }

.lignes { list-style: none; margin: 0; padding: 0; }
.ligne { display: grid; grid-template-columns: 64px 1fr; gap: 2px 14px; padding: 12px 8px; border-top: 1px solid var(--bord); }
.ligne:focus-visible { outline-offset: -2px; }
.ligne.actif { background: linear-gradient(90deg, var(--accent-clair), transparent 80%); }
.heure { border: 0; background: none; padding: 2px 0; font-size: 14px; color: var(--body-soft); font-variant-numeric: tabular-nums; text-align: left; text-decoration: underline dotted; text-underline-offset: 3px; align-self: start; }
.heure:hover { color: var(--accent-fort); }
.heure:disabled { text-decoration: none; cursor: default; color: var(--body-soft); }
.qui { border: 0; background: none; padding: 0; font-size: 14px; font-weight: 650; color: var(--c); display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.qui::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.qui.prop { font-style: italic; }
.ligne p { grid-column: 2; color: var(--ink); cursor: text; overflow-wrap: anywhere; }
.ligne textarea { grid-column: 2; width: 100%; min-height: 60px; padding: 6px 8px; border: 1px solid var(--accent); border-radius: 6px; }
mark { background: #fde3a7; color: inherit; border-radius: 2px; }
mark.courant { background: #f5b84a; }
.ligne.note-l { background: var(--note); border-left: 3px solid var(--note-bord); border-top-color: var(--alerte-bord); }
.note-tag { font-size: 13px; font-weight: 650; color: var(--alerte); display: inline-flex; gap: 6px; align-items: center; }
.note-tag .ico { width: 15px; height: 15px; }
.note-tag .btn { color: var(--alerte); }

.lecteur { position: sticky; bottom: 0; margin-top: 16px; background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); box-shadow: 0 -2px 16px rgb(28 33 36 / .08); padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; z-index: 4; }
.lecteur .btns { display: flex; gap: 4px; }
.rond { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--bord-fort); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.rond.play { background: var(--accent); border-color: var(--accent); color: #fff; }
.piste { display: flex; align-items: center; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--body-soft); min-width: 0; }
.piste input { flex: 1; min-width: 60px; accent-color: var(--accent); }
.lecteur .droite { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.lecteur select { min-height: 36px; border: 1px solid var(--bord-fort); border-radius: 6px; background: var(--surface); padding: 2px 6px; }
.suivre { font-size: 13px; grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; color: var(--body-soft); }
.note-lecteur { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note-lecteur input { flex: 1; min-width: 160px; min-height: 40px; padding: 6px 10px; border: 1px solid var(--accent); border-radius: 6px; }

/* Transcription en cours */
.etapes { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 8px; }
.etapes li { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.etapes .ok { color: var(--succes); }
.etapes .cours { font-weight: 650; color: var(--ink); }
.etapes .attente { color: var(--body-soft); }
.phase { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--bord); }
.rondpt { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--bord-fort); flex: none; }
.cours .rondpt { border-color: var(--accent); border-top-color: transparent; animation: tourne 1s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
.fin { font-size: 22px; font-weight: 650; color: var(--ink); }
.fin span { font-weight: 400; font-size: 17px; color: var(--body); }

/* Erreur */
.erreur-bloc { margin-top: 20px; border: 1px solid var(--danger-bord); background: var(--danger-fond); border-radius: var(--rayon); padding: 16px 18px; }
.erreur-bloc h3 { color: var(--danger); font-size: 17px; display: flex; gap: 8px; align-items: flex-start; }
.erreur-bloc p { margin-top: 6px; color: var(--ink); }
.erreur-bloc .actions { margin-top: 12px; }
.journal { margin-top: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--bord); border-radius: 6px; font-size: 14px; }
.journal code { font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); overflow-wrap: anywhere; user-select: all; }

/* Réglages */
.retour { margin-bottom: 12px; }
.reglage { background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 16px 18px; margin-top: 12px; }
.reglage h3 { font-size: 16px; }
.reglage input[type=text], .reglage input[type=password], .reglage textarea { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--bord-fort); border-radius: var(--rayon); background: var(--surface); }
.reglage textarea { min-height: 120px; }
.ligne-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.ligne-r input { flex: 1; min-width: 160px; }
.temoin { font-size: 13px; font-weight: 600; color: var(--succes); }
.voix-connues { list-style: none; margin: 8px 0 0; padding: 0; }
.voix-connues li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--bord); font-size: 15px; }
.voix-connues li:first-child { border-top: 0; }
.voix-connues small { color: var(--body-soft); display: block; font-size: 13px; }
details.avance { margin-top: 16px; background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon); }
details.avance > summary { padding: 14px 18px; font-weight: 650; color: var(--ink); cursor: pointer; }

<script>
"use strict";
// ---------------------------------------------------------------- outils
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
// Nœud DOM ; jamais d'HTML injecté : les textes viennent des réunions et restent du texte.
function el(tag, props = {}, ...enfants) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("aria-") || k.startsWith("data-") || k === "role" || k === "for" || k === "list") n.setAttribute(k, v === true ? "true" : v);
    else if (k === "style" && typeof v === "string") n.style.cssText = v;
    else n[k] = v;
  }
  n.append(...enfants.flat().filter((x) => x !== null && x !== undefined && x !== false));
  return n;
}
const ico = (nom, classe = "ico") => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", classe);
  s.setAttribute("aria-hidden", "true");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", `#i-${nom}`);
  s.append(u);
  return s;
};
const bouton = (texte, action, classe = "btn petit", props = {}) =>
  el("button", { className: classe, type: "button", onclick: action, ...props }, texte);
const annoncer = (texte) => { $("#annonce").textContent = ""; setTimeout(() => ($("#annonce").textContent = texte), 50); };
const memoire = {  // préférences d'affichage de ce navigateur seulement
  lire(k, d) { try { const v = localStorage.getItem(`reunion.${k}`); return v === null ? d : JSON.parse(v); } catch { return d; } },
  ecrire(k, v) { try { localStorage.setItem(`reunion.${k}`, JSON.stringify(v)); } catch { /* navigation privée */ } },
};

// « Pistes à écouter » : les deux pistes sont toujours enregistrées ; le choix décide de ce qui est transcrit.
const PISTES = { deux: "Micro et son de l'ordinateur (visio)", micro: "Micro seulement (tout le monde dans la pièce)",
  systeme: "Son de l'ordinateur seulement" };
function choixPistes(id, valeur, auChangement) {
  return el("select", { id, onchange: (e) => auChangement?.(e.target.value) },
    ...Object.entries(PISTES).map(([v, n]) => el("option", { value: v, selected: v === valeur }, n)));
}

// Heures et durées (spec, section 2) : « 14:30 », « 1 h 05 min », « 12 min », « 40 s ».
const pad = (n) => String(n).padStart(2, "0");
const heure = (s) => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600);
  return h ? `${h}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}` : `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
const lireHeure = (t) => { const p = String(t).trim().split(":").map(Number);
  if (p.some(isNaN) || p.length < 2 || p.length > 3) return null; return p.reduce((a, x) => a * 60 + x, 0); };
function duree(s) {
  s = Math.round(s || 0);
  if (s < 60) return `${s} s`;
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? (m ? `${h} h ${pad(m)} min` : `${h} h`) : `${m} min`;
}
// Estimation : à la minute au-dessus sous 10 min, aux 5 min au-dessus au-delà (spec 3.2).
const estimation = (s) => { const m = Math.max(1, Math.ceil((s || 0) / 60)); return duree((m < 10 ? m : Math.ceil(m / 5) * 5) * 60); };
const hhmm = (epoch) => { const d = new Date(epoch * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const JOURS = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
const dateDe = (iso) => (iso ? new Date(iso) : null);
const memeJour = (a, b) => a.toDateString() === b.toDateString();
function jour(iso) {
  const d = dateDe(iso);
  if (!d) return "Autres";
  const auj = new Date(), hier = new Date(Date.now() - 864e5);
  if (memeJour(d, auj)) return "Aujourd'hui";
  if (memeJour(d, hier)) return "Hier";
  return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}` + (d.getFullYear() !== auj.getFullYear() ? ` ${d.getFullYear()}` : "");
}
const jourCourt = (iso) => { const d = dateDe(iso); return d ? `${JOURS[d.getDay()].slice(0, 3)}. ${d.getDate()} ${MOIS[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}` : ""; };
const heureDebut = (iso) => { const d = dateDe(iso); return d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : ""; };
const pluriel = (n, mot, motP = `${mot}s`) => `${n} ${n > 1 ? motP : mot}`;
// Jauge : un mot et une largeur, jamais de dB à l'écran.
const motNiveau = (db) => db == null || db < -60 ? "Rien" : db < -40 ? "Faible" : db < -12 ? "Bon" : "Fort";
const largeur = (db) => `${db == null ? 0 : Math.max(0, Math.min(100, (db + 60) / 60 * 100))}%`;

// ---------------------------------------------------------------- serveur
let horsLigne = false;
async function api(chemin, corps) {
  try {
    const r = await fetch(chemin, corps === undefined ? {} : {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps) });
    if (r.status === 401) {  // page ouverte sans le jeton de session (S2)
      $("#hors-ligne p").textContent = "Ouvrez Réunion depuis son icône (barre des menus ou zone de notification).";
      $("#hors-ligne").hidden = false;
      return await r.json();
    }
    const t = r.headers.get("Content-Type") || "";
    if (t.startsWith("application/json")) return await r.json();
    if (!r.ok) return { erreur: { code: "inconnue", cause: "Une erreur inattendue s'est produite.", garde: "" } };
    return { fichier: await r.blob(), nom: decodeURIComponent((r.headers.get("Content-Disposition") || "").split("''")[1] || "export") };
  } catch {
    passerHorsLigne(true);
    return { erreur: { code: "hors_ligne", cause: "Réunion ne répond plus.", garde: "" } };
  }
}
function passerHorsLigne(oui) {
  if (horsLigne === oui) return;
  horsLigne = oui;
  $("#hors-ligne").hidden = !oui;
}

// ---------------------------------------------------------------- petits composants
function temoin() {  // « Enregistré » 2 s à côté d'un champ, ou l'erreur sur place (RG-04, ER-16)
  const t = el("span", { className: "temoin", role: "status" });
  t.montrer = (r) => {
    t.className = r?.erreur ? "ko-t" : "temoin";
    t.textContent = r?.erreur ? r.erreur.cause : "Enregistré";
    clearTimeout(t.minuterie);
    if (!r?.erreur) t.minuterie = setTimeout(() => (t.textContent = ""), 2000);
  };
  return t;
}
async function copier(b, texte, apres = "Copié") {
  const avant = b.textContent;
  try { await navigator.clipboard.writeText(texte); b.textContent = apres; }
  catch { b.textContent = "Copie refusée par le navigateur"; }
  setTimeout(() => (b.textContent = avant), 2000);
}
function toast(texte, annuler) {
  $(".toast")?.remove();
  const t = el("div", { className: "toast", role: "status" }, el("span", {}, texte));
  if (annuler) t.append(bouton("Annuler", async () => { t.remove(); await annuler(); }, "btn lien"));
  document.body.append(t);
  setTimeout(() => t.remove(), annuler ? 10000 : 3000);
}
// Fenêtre de confirmation : focus piégé (dialog modal), Échap ferme, focus rendu au bouton d'origine (AX-07).
function dialogue({ titre, contenu = [], boutons }) {
  const origine = document.activeElement;
  return new Promise((resoudre) => {
    const d = el("dialog", { "aria-labelledby": "dlg-t" }, el("h3", { id: "dlg-t" }, titre), ...contenu,
      el("div", { className: "actions" }, ...boutons.map((b) => el("button", {
        className: `btn ${b.classe || ""}`, type: "button", autofocus: !!b.focus, onclick: () => { d.valeur = b.valeur; d.close(); } }, b.texte))));
    d.addEventListener("close", () => { d.remove(); origine?.focus?.(); resoudre(d.valeur); });
    document.body.append(d);
    d.showModal();
  });
}
function blocJournal(chemin, reunion) {
  const copie = bouton("Copier le journal", async (ev) => {
    const r = await api(`/api/journal${reunion ? `?reunion=${encodeURIComponent(reunion)}` : ""}`);
    copier(ev.currentTarget, r.texte || "");
  });
  return el("div", { className: "journal" },
    el("p", { style: "margin:0 0 6px" }, "Journal : ", el("code", {}, chemin)),
    el("div", { className: "actions" },
      bouton("Ouvrir le dossier", () => api("/api/ouvrir", reunion ? { reunion, journal: true } : { cible: "journal_outil" })),
      copie),
    el("p", { className: "note-aide", style: "margin-top:6px" }, "Collez-le dans un message à la personne qui vous aide."));
}
function blocErreur(e, actions = [], reunion = null, extra = []) {
  return el("div", { className: "erreur-bloc", role: "alert" },
    el("h3", {}, ico("alert"), e.cause), e.garde ? el("p", {}, e.garde) : null, ...extra,
    actions.length ? el("div", { className: "actions" }, ...actions) : null,
    e.journal ? blocJournal(e.journal, reunion) : null);
}
function bandeau(niveau, contenu, actions = []) {
  const role = niveau === "rouge" ? "alert" : "status";
  return el("div", { className: `bandeau ${niveau === "neutre" ? "" : niveau}`, role },
    ico(niveau === "neutre" ? "info" : "alert"),
    el("div", {}, el("p", {}, ...[].concat(contenu)), actions.length ? el("div", { className: "actions" }, ...actions) : null));
}
const ouvrirReglagesSysteme = (quoi) => api("/api/reglages", { quoi });

function depotManuel(c) {
  const sep = c?.separation;
  if (!sep?.a_deposer?.length) return null;
  return el("div", { className: "note-aide", style: "margin-top:8px" },
    el("p", {}, "Si le réseau de cet endroit bloque le téléchargement, téléchargez ces fichiers depuis une autre connexion et déposez-les dans ce dossier, puis relancez Réunion :"),
    el("p", {}, el("code", { className: "chemin" }, sep.dossier)),
    el("ul", { style: "margin:4px 0 0;padding-left:20px" }, ...sep.a_deposer.map((u) => el("li", {}, el("code", { className: "chemin" }, u)))));
}

// ---------------------------------------------------------------- état global
let etat = null, reunions = [], config = null, vue = null;
const estMac = () => (etat?.plateforme || config?.plateforme) === "darwin";
let debutLocal = 0;  // horloge de la page pour le chronomètre
const depuis = () => (performance.now() - debutLocal) / 1000;

async function chargerConfig() { const c = await api("/api/configuration"); if (!c.erreur) config = c; return config; }

async function rafraichir() {
  const [e, r] = await Promise.all([api("/api/etat"), api("/api/reunions")]);
  if (e.erreur || r.erreur) return;
  passerHorsLigne(false);
  const avant = etat;
  if (e.enregistrement && (!avant?.enregistrement || avant.enregistrement.nom !== e.enregistrement.nom))
    debutLocal = performance.now() - e.enregistrement.depuis * 1000;
  [etat, reunions] = [e, r];
  if (!avant || avant.accueil_fini !== e.accueil_fini) return router();
  // Enregistrement démarré ailleurs (barre des menus) ou fenêtre rouverte : écran Enregistrement (EN-13).
  if (e.enregistrement && !avant.enregistrement && !location.hash.startsWith("#enreg")) location.hash = "#enreg";
  dessinerCote();
  vue?.maj?.();
}
function boucle() {
  rafraichir().finally(() => setTimeout(boucle, horsLigne ? 5000 : 2000));  // ER-15 : nouvel essai toutes les 5 s
}

// ---------------------------------------------------------------- colonne
let rechercheGlobale = { q: "", resultats: null };
function etatListe(r) {
  const t = etat?.travaux?.[r.nom];
  if (r.etat === "enregistrement") return el("span", { className: "etat rec" }, `En cours - ${duree(etat?.enregistrement?.depuis || r.duree || 0)}`);
  if (r.etat === "transcription") return el("span", { className: "etat cours" }, `Transcription... ${Math.round((t?.fraction || 0) * 100)} %`);
  if (r.etat === "transcrite") return el("span", { className: "etat pret" }, "Prête");
  if (r.etat === "echec") return el("span", { className: "etat echec" }, "Échec");
  return el("span", { className: "etat" }, "Enregistrée");
}
const routeDe = (r) => (r.etat === "enregistrement" ? "#enreg" : `#reunion/${encodeURIComponent(r.nom)}`);
function dessinerCote() {
  const enr = etat?.enregistrement;
  const b = $("#bouton-enreg");
  b.className = "btn rec btn-enreg";
  b.replaceChildren(el("span", { className: `pastille-rec${enr ? " carre" : ""}`, "aria-hidden": "true" }), el("span", {}, enr ? "Arrêter" : "Enregistrer"));
  // AC-06 : préparation en cours, dans la colonne.
  const p = etat?.preparation, prets = etat?.fichiers_prets;
  $("#bandeau-cote").replaceChildren(...(!prets && p?.en_cours ? [bandeau("neutre", [

  }, "btn lien");

    } else if (etape === 3 || etape === 4) {
      const micro = etape === 3, quoi = micro ? "micro" : "son";
      const ts = etat?.test_son, entendu = essai && ts && (micro ? ts.micro_entendu : ts.son_entendu);
      const echec = essai && (essai.erreur || ts?.erreur || (ts && !ts.en_cours && !entendu));
      const db = ts && (micro ? ts.niveau_micro : ts.niveau_systeme);
      parts.push(...entete(etape), el("h2", { tabIndex: -1 }, micro ? "Micro" : "Son de l'ordinateur"));
      if (micro) parts.push(el("p", { style: "margin-top:8px" }, "Pour noter ce que vous dites, Réunion doit entendre votre micro."));
      else if (estMac()) parts.push(el("p", { style: "margin-top:8px" }, "Pour enregistrer les personnes en visio, Réunion doit entendre le son de ce Mac. macOS appelle cet accès « Enregistrement de l'écran et de l'audio système » : seul le son est gardé, jamais l'image."));
      else parts.push(el("p", { style: "margin-top:8px" }, "Pour enregistrer les personnes en visio, Réunion doit entendre le son de cet ordinateur."));
      if (echec) {  // PL-08
        const err = essai.erreur || ts?.erreur;
        parts.push(el("div", { style: "margin-top:16px" }, bandeau("rouge", [el("b", {}, micro ? "Nous n'entendons pas votre micro." : "Nous n'entendons pas le son de l'ordinateur."),
          err ? ` ${err.cause}` : micro ? " L'accès a été refusé, ou rien n'a été entendu en 10 s." : " Rien n'a été entendu en 10 s."],
          [bouton(micro ? "Ouvrir les réglages du micro" : "Ouvrir les réglages", () => ouvrirReglagesSysteme(micro ? "micro" : estMac() ? "ecran" : "son")),
            bouton("Réessayer", () => lancerEssai(quoi))])));
        // PL-10 : sous Windows, le choix de la sortie n'apparaît que si le test n'entend rien.
        if (!micro && !estMac() && config?.peripheriques) {
          const sel = el("select", { id: "pl-sortie", className: "sel" }, el("option", { value: "" }, `Celui de Windows (${config.peripheriques.sortie_defaut})`),
            ...config.peripheriques.sorties.map((d) => el("option", { value: d.id, selected: d.id === config.reglages.sortie }, d.nom)));
          sel.addEventListener("change", () => api("/api/configuration", { sortie: sel.value }));
          parts.push(el("label", { className: "champ", for: "pl-sortie" }, "Où entendez-vous la visio ?"), sel);
        }
      } else if (!essai) {
        parts.push(el("div", { className: "actions", style: "margin-top:16px" },
          bouton(micro ? "Autoriser le micro" : estMac() ? "Autoriser le son de l'ordinateur" : "Tester le son de l'ordinateur", () => lancerEssai(quoi), "btn principal-btn")));
      } else {
        parts.push(el("p", { style: "margin-top:12px", role: "status" }, entendu
          ? el("span", { className: "fait", style: "font-size:16px;display:inline-flex;gap:6px;align-items:center" }, ico("check"), micro ? "Votre micro fonctionne." : "Le son de l'ordinateur est bien entendu.")
          : micro ? "Dites quelques mots." : "Lancez une vidéo ou une musique quelques secondes."));
      }
      parts.push(el("div", { className: "jauge", style: "margin-top:16px", "aria-label": `${micro ? "Votre micro" : "Son de l'ordinateur"} : ${motNiveau(db)}` },
        el("span", {}, micro ? "Votre micro" : "Son de l'ordinateur"), el("span", { className: "barre", "aria-hidden": "true" }, el("i", { style: `width:${largeur(db)}` })), el("b", {}, motNiveau(db))));
      parts.push(preparationBas(), el("div", { className: "actions", style: "margin-top:20px;justify-content:space-between" },
        bouton("Passer cette étape", async () => {  // PL-08 : l'accueil dira « Il manque une étape »
          if (etat?.test_son?.en_cours) await api("/api/test-son", { arreter: true });
          await api("/api/configuration", { [micro ? "etat_micro" : "etat_son"]: "refuse" });
          aller(etape + 1);
        }, "btn lien"),
        bouton("Continuer", async () => { if (etat?.test_son?.en_cours) await api("/api/test-son", { arreter: true }); aller(etape + 1); }, "btn principal-btn", { disabled: !entendu })));
    } else {
      const p = etat?.preparation, prets = etat?.fichiers_prets;
      const fini = prets && (!p || !p.en_cours);
      const pct = p ? Math.round(p.fait_mo / Math.max(1, p.total_mo) * 100) : 100;
      const coche = (texte, cl) => el("li", { className: cl }, cl === "ok" ? ico("check") : el("span", { className: "rondpt", "aria-hidden": "true" }), texte);
      const etapeP = fini ? "fini" : p?.etape || "telechargement";
      const ordre = ["telechargement", "preparation", "vitesse", "fini"];
      const cl = (nomE) => ordre.indexOf(etapeP) > ordre.indexOf(nomE) ? "ok" : etapeP === nomE ? "cours" : "attente";
      parts.push(...entete(5), el("h2", { tabIndex: -1 }, "Préparation pour cet ordinateur"));
      if (p?.erreur) {
        const e = p.erreur;  // PL-13, PL-14
        parts.push(el("div", { style: "margin-top:16px" }, e.code === "reseau_absent"
          ? bandeau("jaune", [el("b", {}, "Téléchargement en pause : pas de connexion internet."), ` Il reprendra seul au retour du réseau. Les ${p.fait_mo} Mo déjà reçus sont gardés.`],
            [bouton("Réessayer maintenant", () => api("/api/preparer", { reessayer: true }))])
          : bandeau("rouge", e.cause, [bouton("Réessayer", () => api("/api/preparer", {}))])));
      }
      parts.push(el("ul", { className: "coches" },
        coche(cl("telechargement") === "ok" || fini ? `Fichiers téléchargés (${p?.total_mo || config?.qualites?.find((q) => q.modele === config.modele)?.mo || 0} Mo)` : `Téléchargement : ${p?.fait_mo || 0} Mo sur ${p?.total_mo || 0} Mo`, fini ? "ok" : cl("telechargement")),
        coche("Préparation pour cet ordinateur", fini ? "ok" : cl("preparation")),
        coche("Essai de vitesse", fini ? "ok" : cl("vitesse"))));
      if (!fini) parts.push(el("div", { style: "display:flex;gap:10px;align-items:center" }, el("progress", { max: 100, value: pct, "aria-label": "Téléchargement" }), el("b", {}, `${pct} %`)));
      if (config?.mo_separation) parts.push(el("p", { className: "note-aide", style: "margin-top:6px" },
        `${(p?.total_mo || 0)} Mo = fichiers de transcription (${(p?.total_mo || 0) - config.mo_separation} Mo) et de séparation des voix (${config.mo_separation} Mo).`));
      if (p && !p.separation_ok) parts.push(el("p", { style: "margin-top:12px" }, "Les voix ne seront pas séparées pour l'instant. Réunion réessaiera au prochain lancement."), depotManuel(config));  // PL-16
      parts.push(el("p", { style: "margin-top:12px" }, fini
        ? `C'est prêt. Sur cet ordinateur, une réunion de 1 h sera transcrite en ${estimation((config?.vitesse_k || 1) * 3600)} environ.`  // PL-11
        : "Vous pouvez déjà enregistrer : la transcription attendra la fin de la préparation."));  // PL-12
      parts.push(el("div", { className: "actions", style: "margin-top:20px;justify-content:flex-end" }, bouton("Aller à mes réunions", async () => {
        await api("/api/configuration", { accueil_fini: true });
        await rafraichir();
        location.hash = "#";
      }, "btn principal-btn")));
    }
    racine.replaceChildren(...parts.filter(Boolean));
  }
  const dessinerErreur = (e) => racine.append(blocErreur(e));
  chargerConfig().then(dessiner);
  let sig = "";
  return { noeud: racine, maj() {
    if (racine.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
    const s = JSON.stringify([etat.preparation, etat.fichiers_prets, etat.test_son, etape]);
    if (s !== sig) { sig = s; dessiner(); }
  } };
}

// ---------------------------------------------------------------- routes
function router() {
  if (!etat) return;
  vue?.quitter?.();
  const premier = !etat.accueil_fini;
  $("#accueil1").hidden = !premier;
  $("#page").hidden = premier;
  if (premier) {
    vue = vueAccueil1();
    $("#accueil1").replaceChildren(vue.noeud);
    return;
  }
  const h = location.hash;
  let m;
  const page = $("#page");
  if (h === "#reglages") { vue = vueReglages(); }
  else if (h === "#enreg") vue = etat.enregistrement ? vueEnregistrement() : (location.hash = "#", vueAccueil());
  else if ((m = h.match(/^#reunion\/([^?]+)(?:\?q=(.*))?$/))) vue = vueReunion(decodeURIComponent(m[1]), m[2] && decodeURIComponent(m[2]));
  else vue = vueAccueil();
  if (h !== "#reglages") avantReglages = h || "#";
  const detail = h !== "" && h !== "#";
  page.classList.toggle("detail", detail);
  page.classList.toggle("liste-seule", !detail);
  $(".retour-mobile").hidden = h === "#reglages";  // les Réglages ont leur propre retour
  $("#vue").replaceChildren(vue.noeud);
  dessinerCote();
  if (detail) $("#contenu").focus({ preventScroll: true });
  if (!h.startsWith("#reunion/")) scrollTo(0, 0);
}
addEventListener("hashchange", router);
document.addEventListener("keydown", (e) => vue?.clavier?.(e));

(async () => {
  await chargerConfig();
  await rafraichir();
  if (!etat) { passerHorsLigne(true); }
  // Fenêtre rouverte pendant un enregistrement : écran Enregistrement, bon chronomètre (EN-13).
  if (etat?.enregistrement && etat.accueil_fini && !location.hash) location.hash = "#enreg";
  boucle();
})();
</script>
